<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maille</title>
<meta name="description" content="Animated ASCII scenes. Start from a scene, drop in your own image or text, and embed it anywhere.">
<meta property="og:title" content="Maille">
<meta property="og:description" content="Animated ASCII scenes. Drop in your own image or text, embed it anywhere.">
<meta property="og:image" content="https://maille-pi.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* The scene fills the screen. Scenes run along the bottom bar; settings open in a drawer over the scene. */
  :root {
    --bg: #08090a; --surface: #0e0f11; --line: #1f2125; --line2: #2a2d32;
    --fg: #e7e8ea; --muted: #80858d; --accent: #5ec8e0;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --pad: 20px; --head: 52px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  .app { position: relative; height: 100dvh; display: grid; grid-template-rows: var(--head) minmax(0, 1fr) auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--pad); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
  .brand img { width: 20px; height: 20px; display: block; }
  nav { display: flex; gap: 20px; color: var(--muted); }
  nav a:hover { color: var(--fg); }

  /* Stage */
  .well { position: relative; min-height: 0; container-type: size; display: grid; place-items: center; background: #050506; }
  .frame { position: relative; aspect-ratio: var(--ar); width: min(100cqw, 100cqh * var(--arn)); }
  .frame.full { aspect-ratio: auto; width: 100%; height: 100%; }
  .frame.drop::after { content: ""; position: absolute; inset: 0; outline: 1px solid var(--accent); outline-offset: -1px; pointer-events: none; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Bottom bar: scenes, then actions */
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 12px var(--pad) max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 104px; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  .strip::-webkit-scrollbar { display: none; }
  .tile { display: grid; gap: 6px; padding: 0; border: 0; background: none; color: var(--muted); font-size: 12px; text-align: left; cursor: pointer; scroll-snap-align: start; }
  .tile maille-scene { width: 100%; aspect-ratio: 4 / 3; outline: 1px solid var(--line); pointer-events: none; }
  .tile:hover, .tile[aria-pressed=true] { color: var(--fg); }
  .tile[aria-pressed=true] maille-scene { outline-color: var(--fg); }
  .tile:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  .tile span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: grid; grid-auto-flow: column; gap: 8px; }

  /* Drawer */
  .drawer { position: absolute; top: var(--head); right: 0; bottom: var(--bar, 0px); width: 320px; display: grid; grid-template-rows: minmax(0, 1fr) auto;
    background: rgba(10, 11, 13, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-left: 1px solid var(--line);
    transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s; z-index: 5; }
  .drawer.open { transform: none; visibility: visible; transition: transform .2s ease; }
  .scroll { overflow-y: auto; overscroll-behavior: contain; }
  .sec { padding: 18px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 18px; font-weight: 500; }
  .sec-h > span:last-child { display: flex; gap: 16px; }
  .stack { display: grid; gap: 16px; }
  .link { padding: 0; border: 0; background: none; font-weight: 400; color: var(--muted); cursor: pointer; }
  .link:hover { color: var(--fg); }
  details > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--muted); cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "+"; font: 14px var(--mono); }
  details[open] > summary::after { content: "−"; }
  details > summary:hover { color: var(--fg); }
  details[open] > .stack { margin-top: 16px; }
  .foot { padding: 14px 20px; border-top: 1px solid var(--line); }

  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 8px; }
  .row > .lbl { color: var(--muted); }
  .row output { font: 12px var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .row > input[type=range], .row > .seg, .row > textarea, .row > .chips, .row > input[type=text] { grid-column: 1 / -1; }
  .bgpick { display: flex; align-items: center; gap: 12px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line2); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 28px; height: 18px; padding: 0; border: 1px solid var(--line2); background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 0; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 0; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; font-size: 13px; white-space: nowrap; background: transparent; border: 1px solid var(--line2); border-radius: 0; cursor: pointer; position: relative; }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; }
  .btn.primary:hover { background: #fff; }
  .btn[aria-expanded=true] { background: var(--line2); }
  .btn:disabled { color: var(--muted); cursor: default; }
  .btn:focus-visible, .btn:focus-within { outline: 1px solid var(--accent); outline-offset: 1px; }
  .btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line2); }
  .seg button { height: 30px; border: 0; border-left: 1px solid var(--line2); background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 4px; }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: var(--fg); }
  .seg button[aria-pressed=true] { color: var(--bg); background: var(--fg); }
  .seg button:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; }
  .seg.grid3 { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
  .seg.grid3 button { border-top: 1px solid var(--line2); }
  .seg.grid3 button:nth-child(3n + 1) { border-left: 0; }
  .seg.grid3 button:nth-child(-n + 3) { border-top: 0; }
  .seg.glyphs button { font: 13px var(--mono); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { height: 26px; padding: 0 9px; border: 1px solid var(--line2); background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
  .chips button:hover { color: var(--fg); }
  .chips button[aria-pressed=true] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .chips button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }

  .switch { width: 28px; height: 16px; padding: 0; position: relative; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--muted); transition: transform .12s, background .12s; }
  .switch[aria-checked=true] { background: var(--line2); }
  .switch[aria-checked=true]::after { transform: translateX(12px); background: var(--fg); }
  .switch:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  textarea, input[type=text] { font: 13px var(--mono); color: var(--fg); background: var(--surface); border: 1px solid var(--line2); border-radius: 0; padding: 8px 10px; width: 100%; }
  textarea { min-height: 64px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: 1px solid var(--accent); outline-offset: -1px; }
  ::placeholder { color: #50545b; }

  .toast { position: fixed; left: 50%; top: calc(var(--head) + 16px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
  .toast.on { opacity: 1; }

  .drawer .close { display: none; }
  @media (min-width: 861px) { .app.editing .well { margin-right: 320px; } }
  @media (max-width: 860px) {
    :root { --pad: 16px; }
    .bar { grid-template-columns: 1fr; gap: 12px; }
    .strip { margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); scroll-padding-inline: var(--pad); grid-auto-columns: 92px; }
    .actions { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
    .actions .btn { padding: 0 6px; }
    .actions .primary { grid-column: 1 / -1; grid-row: 1; }
    .drawer { top: auto; left: 0; width: auto; bottom: 0; max-height: 72dvh; border-left: 0; border-top: 1px solid var(--line); transform: translateY(100%); }
    .drawer.open { transform: none; }
    .drawer .close { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer, .drawer.open, .switch::after, .toast { transition: none; } }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <a class="brand" href="./"><img src="/favicon.svg" alt="" width="20" height="20">Maille</a>
    <nav><a href="docs.html">Docs</a><a href="docs.html#skill">Claude skill</a></nav>
  </header>

  <div class="well"><div class="frame" id="frame"><canvas id="cv" aria-label="Animated ASCII scene"></canvas></div></div>

  <div class="bar" id="bar">
    <div class="strip" id="strip" aria-label="Scenes"></div>
    <div class="actions">
      <label class="btn" for="file">Upload image<input type="file" id="file" accept="image/*"></label>
      <button class="btn" id="useText">Write text</button>
      <button class="btn" id="edit" aria-expanded="false" aria-controls="drawer">Edit</button>
      <button class="btn primary" id="copyEmbed">Copy embed</button>
    </div>
  </div>

  <aside class="drawer" id="drawer" aria-label="Settings">
    <div class="scroll">
      <div class="sec">
        <div class="sec-h"><span id="sceneTitle">Scene</span><span><button class="link" id="shuffle">Shuffle</button><button class="link close" id="close">Close</button></span></div>
        <div class="stack" id="sceneBody"></div>
        <details id="sceneMore"><summary>More</summary><div class="stack" id="sceneMoreBody"></div></details>
      </div>
      <div class="sec">
        <div class="sec-h">Style</div>
        <div class="stack" id="styleBody"></div>
        <details><summary>More</summary><div class="stack" id="styleMoreBody"></div></details>
      </div>
    </div>
    <div class="foot"><div class="pair"><button class="btn" id="png">Save PNG</button><button class="btn" id="rec">Record video</button></div></div>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="maille.js?v=9fe9ec73"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const AF = window.Maille;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const FORMATS = { 'Full': null, '16:9': [16, 9], '3:4': [3, 4], '1:1': [1, 1], '9:16': [9, 16] };
  const SCENE_NAMES = { alpenglow: 'Alpenglow', sharks: 'Sharks', mantas: 'Mantas', koi: 'Koi', birds: 'Birds', waves: 'Ocean', landscape: 'Landscape', image: 'Image', text: 'Text' };
  // Scenes in the bar: [preset key, label]
  const GALLERY = [
    ['sharks', 'Sharks'], ['hammerheads', 'Hammerheads'], ['koi', 'Koi'], ['gold-koi', 'Gold koi'], ['koi-lanes', 'Koi lanes'], ['mantas', 'Mantas'],
    ['gulls', 'Gulls'], ['starlings', 'Starlings'], ['alpenglow', 'Alpenglow'], ['golden-hour', 'Golden hour'], ['alpine-day', 'Alpine day'], ['day-cycle', 'Day cycle'],
    ['block-alps', 'Block alps'], ['night-ocean', 'Ocean'], ['binary-sea', 'Binary sea'], ['alpine-cow', 'Cow'], ['meadow', 'Meadow'], ['type', 'Type'],
  ];
  const RAMPS = [['Classic', '@8%SX#t;:', '@8%'], ['Dense', '@%#*+=-:.', '#*='], ['Letters', 'MWNXK0Okxdol:,.', 'MWN'], ['Blocks', '█▓▒░', '█▓░'], ['Binary', '10', '010'], ['Dots', '●•·', '●•·']];
  const VARIETIES = ['kohaku', 'tancho', 'sanke', 'showa', 'utsuri', 'asagi', 'shusui', 'chagoi', 'kujaku', 'butterfly', 'silver', 'gold'];
  const FONTS = [['700 200px Inter, "Helvetica Neue", Arial, sans-serif', 'Sans'], ['700 200px Georgia, "Times New Roman", serif', 'Serif'], ['700 200px "JetBrains Mono", ui-monospace, monospace', 'Mono']];
  const PROCEDURAL = ['alpenglow', 'sharks', 'mantas', 'koi', 'birds', 'waves', 'landscape'];

  const pct = (v) => Math.round(v * 100) + '%', int = (v) => String(Math.round(v)), xx = (v) => (+v).toFixed(1) + '×', deg = (v) => Math.round(v) + '°';

  // ---------- controls ----------
  const R = (k, label, min, max, step, fmt) => ({ k, label, type: 'range', min, max, step, fmt });
  const T = (k, label) => ({ k, label, type: 'toggle' });
  const count = (label, max = 12) => R('count', label, 1, max, 1, int);
  const size = R('size', 'Size', 0.4, 1.8, 0.01, xx), dir = R('heading', 'Direction', -180, 180, 5, deg), spread = R('spread', 'Spread', 0, 90, 1, deg);
  const sides = R('sides', 'Clear centre', 0, 0.45, 0.01, (v) => (v > 0 ? pct(1 - 2 * v) : 'Off'));
  const ambient = R('ambient', 'Light in the water', 0, 2, 0.05, xx);
  const motion = R('animAmount', 'Motion', 0, 2, 0.05, xx);
  // Per scene: [main controls, under More]
  const SCENE_UI = {
    sharks: [[{ k: 'speciesSet', label: 'Species', type: 'seg', options: [['mix', 'Mix'], ['grey', 'Grey'], ['sand', 'Sand'], ['hammer', 'Hammer']] }, count('Sharks'), size, dir],
      [spread, sides, ambient, T('trails', 'Wakes'), T('contour', 'Outlines')]],
    mantas: [[count('Mantas'), size, dir], [spread, sides, ambient, T('trails', 'Wakes'), T('contour', 'Outlines')]],
    koi: [[count('Koi', 16), size, R('koiPads', 'Lily pads', 0, 14, 1, int)],
      [{ k: 'varieties', label: 'Varieties', type: 'chips' }, R('koiRipples', 'Ripples', 0, 2, 0.05, xx), sides, spread, ambient, T('contour', 'Outlines')]],
    birds: [[count('Birds', 20), size, dir], [spread, sides, T('trails', 'Trails'), T('contour', 'Outlines')]],
    waves: [[R('size', 'Swell', 0.3, 2, 0.01, xx), { k: 'heading', label: 'Direction', type: 'seg', options: [[0, 'Right'], [180, 'Left']] }], [T('trails', 'Foam')]],
    landscape: [[R('size', 'Relief', 0.3, 2, 0.01, xx)], [T('trails', 'Mist')]],
    alpenglow: [
      [R('agDaylight', 'Daylight', 0, 1, 0.01, pct), T('agCycle', 'Day cycle'), R('agClouds', 'Clouds', 0, 2, 0.05, xx), R('agSnow', 'Snow', 0, 1, 0.01, pct)],
      [R('agCycleSpeed', 'Cycle speed', 0.2, 4, 0.1, xx), R('agPeak1', 'Left peak', 0.1, 0.9, 0.01, pct), R('agPeak2', 'Right peak', 0.1, 0.9, 0.01, pct), R('agRugged', 'Rugged', 0, 2, 0.05, xx),
        R('agMist', 'Mist', 0, 2, 0.05, xx), R('agStars', 'Stars', 0, 2, 0.05, xx), R('agBirds', 'Birds', 0, 20, 1, int), R('agFireflies', 'Fireflies', 0, 60, 1, int),
        R('agFlowers', 'Flowers', 0, 2, 0.05, xx), R('agWind', 'Wind', 0, 3, 0.05, xx), T('agTrees', 'Trees'), T('agSun', 'Sun')]],
    image: [[motion, R('size', 'Zoom', 0.5, 3, 0.01, xx), R('threshold', 'Threshold', 0.02, 0.9, 0.01, (v) => (+v).toFixed(2)), T('color', 'Original colours')], [T('invert', 'Invert')]],
    text: [[{ k: 'text', label: 'Text', type: 'text' }, { k: 'textFont', label: 'Font', type: 'seg', options: FONTS }, motion], [R('size', 'Zoom', 0.5, 2, 0.01, xx)]],
  };
  const STYLE_UI = [
    [{ k: 'format', label: 'Format', type: 'seg', options: Object.keys(FORMATS).map((f) => [f, f]) },
      { k: 'ramp', label: 'Characters', type: 'glyphs' },
      R('cols', 'Detail', 24, 300, 2, int), R('speed', 'Speed', 0, 3, 0.05, xx)],
    [{ k: 'ramp', label: 'Your characters', type: 'chars' }, R('cellAspect', 'Cell height', 1, 2.4, 0.05, xx), R('brightness', 'Brightness', 0.4, 1.8, 0.02, xx), R('saturation', 'Saturation', 0, 2, 0.02, xx),
      R('glitch', 'Glitch', 0, 0.4, 0.005, pct), T('glow', 'Glow dots'), T('grid', 'Grid'), { k: 'background', label: 'Background', type: 'bg' }],
  ];

  // ---------- state ----------
  const LS_STATE = 'maille:state2', LS_FROM = 'maille:from2';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage full or unavailable */ } },
  };
  const fromPreset = (key) => Object.assign(clone(AF.PRESETS[key].config), { format: 'Full' });
  const saved = store.get(LS_STATE);
  let from = saved ? store.get(LS_FROM) || '' : 'koi-lanes';
  let S = AF.resolve(saved || fromPreset(from));
  let source = null;

  // ---------- engine ----------
  const appEl = $('app'), frameEl = $('frame'), cv = $('cv'), ctx = cv.getContext('2d');
  const engineOpts = () => AF.toEngine(S, source);
  const engine = AF.create(Object.assign({ width: 640, height: 360 }, engineOpts()));
  const lastSent = {};
  const sig = (v) => (v && typeof v === 'object' ? JSON.stringify(v) : v);
  for (const [k, v] of Object.entries(engineOpts())) lastSent[k] = sig(v);
  // Send only what changed, so sliders never rebuild the scene needlessly
  function push() {
    const o = engineOpts(), diff = {};
    for (const k in o) { const sv = sig(o[k]); if (lastSent[k] !== sv) { diff[k] = o[k]; lastSent[k] = sv; } }
    if (Object.keys(diff).length) engine.set(diff);
    save();
  }
  let saveT = 0;
  function save() { clearTimeout(saveT); saveT = setTimeout(() => { store.set(LS_STATE, S); store.set(LS_FROM, from); }, 300); }

  function applyFormat() {
    const f = FORMATS[S.format];
    frameEl.classList.toggle('full', !f);
    if (f) { frameEl.style.setProperty('--ar', `${f[0]} / ${f[1]}`); frameEl.style.setProperty('--arn', String(f[0] / f[1])); }
    requestAnimationFrame(fit);
  }
  function fit() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(2, Math.round(r.width * dpr)), h = Math.max(2, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; engine.set({ width: w, height: h }); }
  }
  new ResizeObserver(fit).observe(cv);
  new ResizeObserver(() => appEl.style.setProperty('--bar', $('bar').offsetHeight + 'px')).observe($('bar'));

  // ---------- control builders ----------
  let controls = [], uid = 0;
  function control(def) {
    const id = 'c' + (++uid);
    const row = document.createElement('div');
    row.className = 'row';
    const set = (v) => { S[def.k] = v; if (def.k === 'format') applyFormat(); push(); syncAll(); };
    if (def.type === 'range') {
      row.innerHTML = `<label class="lbl" for="${id}">${def.label}</label><output for="${id}"></output><input type="range" id="${id}" min="${def.min}" max="${def.max}" step="${def.step}">`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      inp.addEventListener('input', () => { const v = parseFloat(inp.value); out.textContent = def.fmt(v); S[def.k] = v; push(); });
      row.sync = () => { inp.value = S[def.k]; out.textContent = def.fmt(+S[def.k]); };
    } else if (def.type === 'toggle') {
      row.innerHTML = `<span class="lbl" id="${id}">${def.label}</span><button class="switch" role="switch" aria-labelledby="${id}"></button>`;
      const b = row.querySelector('button');
      b.addEventListener('click', () => set(!S[def.k]));
      row.sync = () => b.setAttribute('aria-checked', String(!!S[def.k]));
    } else if (def.type === 'seg' || def.type === 'glyphs') {
      const glyphs = def.type === 'glyphs';
      row.innerHTML = `<span class="lbl">${def.label}</span><div class="seg${glyphs ? ' grid3 glyphs' : ''}" role="group" aria-label="${def.label}"></div>`;
      const seg = row.querySelector('.seg');
      const opts = glyphs ? RAMPS.map(([name, ramp, sample]) => [ramp, sample, name]) : def.options;
      for (const [v, l, title] of opts) {
        const b = document.createElement('button'); b.textContent = l; b.dataset.v = v;
        if (title) { b.title = title; b.setAttribute('aria-label', title); }
        b.addEventListener('click', () => { if (glyphs) S.rampPreset = v; set(typeof v === 'number' ? +v : v); });
        seg.appendChild(b);
      }
      row.sync = () => { for (const b of seg.children) b.setAttribute('aria-pressed', String(String(S[def.k]) === b.dataset.v)); };
    } else if (def.type === 'chips') {
      row.innerHTML = `<span class="lbl">${def.label}</span><div class="chips" role="group" aria-label="${def.label}"></div>`;
      const box = row.querySelector('.chips');
      for (const v of VARIETIES) {
        const b = document.createElement('button'); b.textContent = v[0].toUpperCase() + v.slice(1); b.dataset.v = v;
        b.addEventListener('click', () => {
          const cur = new Set(S.varieties || []);
          if (cur.has(v)) cur.delete(v); else cur.add(v);
          set(cur.size ? VARIETIES.filter((x) => cur.has(x)) : null);
        });
        box.appendChild(b);
      }
      row.sync = () => { const cur = new Set(S.varieties || []); for (const b of box.children) b.setAttribute('aria-pressed', String(cur.has(b.dataset.v))); };
    } else if (def.type === 'text' || def.type === 'chars') {
      const area = def.type === 'text';
      row.innerHTML = area
        ? `<textarea id="${id}" rows="2" spellcheck="false" aria-label="${def.label}"></textarea>`
        : `<label class="lbl" for="${id}">${def.label}</label><span></span><input type="text" id="${id}" spellcheck="false" maxlength="24" placeholder="Dense to light, e.g. #+-.">`;
      const inp = row.querySelector(area ? 'textarea' : 'input');
      inp.addEventListener('input', () => {
        if (area) S.text = inp.value.trim() ? inp.value : ' ';
        else { const v = inp.value.replace(/\s/g, ''); if (!v) return; S.ramp = v; S.rampPreset = ''; }
        push(); syncAll();
      });
      row.sync = () => { if (document.activeElement !== inp) inp.value = area ? S.text : (RAMPS.some((r) => r[1] === S.ramp) ? '' : S.ramp); };
    } else if (def.type === 'bg') {
      row.innerHTML = `<span class="lbl" id="${id}">${def.label}</span><span class="bgpick"><button class="link" type="button">Scene</button><input type="color" aria-labelledby="${id}"></span>`;
      const auto = row.querySelector('button'), col = row.querySelector('input');
      auto.addEventListener('click', () => { S.bgAuto = true; push(); syncAll(); });
      col.addEventListener('input', () => { S.bgAuto = false; S.background = col.value; push(); syncAll(); });
      row.sync = () => { col.value = /^#[0-9a-f]{6}$/i.test(S.background) ? S.background : '#050506'; auto.style.color = S.bgAuto ? 'var(--fg)' : ''; };
    }
    row.dataset.k = def.k;
    row.sync();
    controls.push(row);
    return row;
  }
  function refreshDeps() {
    for (const r of controls) {
      const k = r.dataset.k;
      if (k === 'animAmount') r.hidden = !S.anim;
      if (k === 'agDaylight') r.hidden = S.agCycle;
      if (k === 'agCycleSpeed') r.hidden = !S.agCycle;
    }
  }
  function fill(el, defs) { el.innerHTML = ''; for (const d of defs) el.appendChild(control(d)); }
  function buildUI() {
    controls = [];
    const [main, more] = SCENE_UI[S.scene] || [[], []];
    fill($('sceneBody'), main); fill($('sceneMoreBody'), more);
    $('sceneBody').hidden = !main.length; $('sceneMore').hidden = !more.length;
    fill($('styleBody'), STYLE_UI[0]); fill($('styleMoreBody'), STYLE_UI[1]);
    $('sceneTitle').textContent = SCENE_NAMES[S.scene] || 'Scene';
    $('shuffle').hidden = !PROCEDURAL.includes(S.scene);
    refreshDeps();
  }
  function syncAll() { for (const r of controls) r.sync(); refreshDeps(); }

  // ---------- drawer ----------
  function openDrawer(on) {
    $('drawer').classList.toggle('open', on);
    appEl.classList.toggle('editing', on);
    $('edit').setAttribute('aria-expanded', String(on));
    $('edit').textContent = on ? 'Done' : 'Edit';
  }
  $('edit').addEventListener('click', () => openDrawer(!$('drawer').classList.contains('open')));
  $('close').addEventListener('click', () => openDrawer(false));

  // ---------- scenes in the bar: every tile is a live embed ----------
  function buildStrip() {
    const strip = $('strip');
    for (const [key, label] of GALLERY) {
      if (!AF.PRESETS[key]) continue;
      const b = document.createElement('button'); b.className = 'tile'; b.dataset.key = key;
      const sc = document.createElement('maille-scene'); sc.setAttribute('preset', key);
      const cfg = AF.PRESETS[key].config, heavy = !cfg.scene || cfg.scene === 'alpenglow';
      // small tiles read better with a coarser grain
      sc.setAttribute('config', JSON.stringify(Object.assign({ cols: Math.min(cfg.cols || 200, heavy ? 64 : 44) }, key === 'type' ? { text: 'Aa' } : {})));
      const name = document.createElement('span'); name.textContent = label;
      b.append(sc, name);
      b.addEventListener('click', () => loadPreset(key));
      strip.appendChild(b);
    }
    syncStrip();
  }
  function syncStrip() { for (const b of $('strip').children) b.setAttribute('aria-pressed', String(b.dataset.key === from)); }
  function setState(next, key) {
    S = AF.resolve(next); from = key || ''; source = null;
    applyFormat(); push(); buildUI(); syncStrip(); syncSrc();
  }
  function loadPreset(key) { setState(Object.assign(fromPreset(key), { format: S.format }), key); }

  // ---------- your image, your text ----------
  // Pictures travel inside the embed as a small data URL, so an uploaded image embeds like any other scene
  function syncSrc() {
    if (S.scene !== 'image' || !S.src) return;
    const want = S.src;
    AF.loadSrc(want).then((img) => { if (S.src === want) { source = img; push(); } }, () => toast('Image could not be loaded'));
  }
  function loadImage(file) {
    if (!file || !file.type.startsWith('image/')) { if (file) toast('Use an image file'); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let data = c.toDataURL('image/webp', 0.82);
      if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url);
      const keep = S.scene === 'image' ? { color: S.color, invert: S.invert, threshold: S.threshold } : { threshold: 0.06 };
      setState(Object.assign({}, S, keep, { scene: 'image', src: data, anim: clone(AF.MOTION.photo), animAmount: 1, size: 1, cols: Math.max(S.cols, 140) }), '');
      openDrawer(true);
    };
    img.onerror = () => toast('That image could not be read');
    img.src = url;
  }
  $('file').addEventListener('change', (e) => { loadImage(e.target.files[0]); e.target.value = ''; });
  $('useText').addEventListener('click', () => {
    if (S.scene !== 'text') setState(Object.assign(fromPreset('type'), { text: 'HELLO', format: S.format, ramp: S.ramp, rampPreset: S.rampPreset }), '');
    openDrawer(true);
    const ta = $('sceneBody').querySelector('textarea');
    if (ta) { ta.focus(); ta.select(); }
  });
  frameEl.addEventListener('dragover', (e) => { e.preventDefault(); frameEl.classList.add('drop'); });
  frameEl.addEventListener('dragleave', () => frameEl.classList.remove('drop'));
  frameEl.addEventListener('drop', (e) => { e.preventDefault(); frameEl.classList.remove('drop'); loadImage(e.dataTransfer.files[0]); });
  document.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/')); if (f) loadImage(f); });

  // ---------- stage: play, grain zoom, koi follow the cursor ----------
  let simT = 0, last = performance.now(), playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('shuffle').addEventListener('click', () => { S.seed = (Math.random() * 99999) | 0; push(); });
  document.addEventListener('keydown', (e) => {
    if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); playing = !playing; }
    if (e.key === 'Escape') openDrawer(false);
    if (e.key === 'e') openDrawer(!$('drawer').classList.contains('open'));
  });
  let zoomCols = null, zoomRaf = 0;
  function zoomTo(c) {
    zoomCols = Math.max(24, Math.min(300, c));
    if (zoomRaf) return;
    zoomRaf = requestAnimationFrame(() => {
      zoomRaf = 0;
      const c2 = Math.round(zoomCols / 2) * 2;
      if (c2 !== S.cols) { S.cols = c2; push(); syncAll(); }
    });
  }
  frameEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY, base = zoomCols != null && Math.abs(zoomCols - S.cols) < 2 ? zoomCols : S.cols;
    zoomTo(base * Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  let splash = 0;
  const at = (e) => { const r = frameEl.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  frameEl.addEventListener('pointermove', (e) => { if (S.scene === 'koi') engine.set({ pointer: at(e) }); });
  frameEl.addEventListener('pointerleave', () => engine.set({ pointer: null }));
  frameEl.addEventListener('click', (e) => { if (S.scene === 'koi') engine.set({ pointer: at(e), splash: ++splash }); });
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) simT += dt * S.speed;
    engine.render(ctx, simT);
    requestAnimationFrame(tick);
  }

  // ---------- output ----------
  const toastEl = $('toast'); let toastT = 0;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 1800); }
  function download(name, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  const fileName = (ext) => `maille-${from || S.scene}.${ext}`;
  $('png').addEventListener('click', () => {
    const W = 2560, H = Math.round(W * cv.height / cv.width);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    AF.create(Object.assign(engineOpts(), { width: W, height: H })).render(off.getContext('2d'), simT);
    off.toBlob((b) => { download(fileName('png'), b); toast('PNG saved'); }, 'image/png');
  });
  $('rec').addEventListener('click', () => {
    const btn = $('rec'); if (btn.disabled) return;
    const type = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!type) { toast('This browser cannot record video'); return; }
    const secs = 8, rec = new MediaRecorder(cv.captureStream(60), { mimeType: type, videoBitsPerSecond: 24e6 });
    const chunks = []; rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = () => { btn.disabled = false; btn.textContent = 'Record video'; download(fileName(type.includes('mp4') ? 'mp4' : 'webm'), new Blob(chunks, { type: type.split(';')[0] })); toast('Video saved'); };
    playing = true; btn.disabled = true; rec.start();
    let left = secs; btn.textContent = `Recording ${left} s`;
    const iv = setInterval(() => { left--; if (left > 0) btn.textContent = `Recording ${left} s`; else { clearInterval(iv); rec.stop(); } }, 1000);
  });
  const SITE = /^https?:/.test(location.protocol) ? location.origin : 'https://maille-pi.vercel.app';
  function embedCode() {
    const cfg = AF.compact(S), f = FORMATS[S.format];
    delete cfg.format;
    const json = JSON.stringify(cfg).replace(/'/g, '&#39;');
    const style = f ? `display:block;width:100%;aspect-ratio:${f[0]}/${f[1]}` : 'display:block;width:100%;height:100%;min-height:320px';
    return `<script src="${SITE}/maille.js" defer><\/script>\n<maille-scene config='${json}' style="${style}"></maille-scene>`;
  }
  $('copyEmbed').addEventListener('click', () => {
    navigator.clipboard.writeText(embedCode()).then(() => toast('Embed code copied'), () => toast('Copy was blocked by the browser'));
  });

  window.maille = { engine, get state() { return S; }, seek(t) { playing = false; simT = t; engine.render(ctx, t); } };

  applyFormat(); buildUI(); buildStrip(); fit(); syncSrc();
  if (document.fonts) document.fonts.ready.then(() => engine.refresh());
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
