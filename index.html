<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maille</title>
<meta name="description" content="Maille turns landscapes, sharks, waves, images and type into animated ASCII grids you can tune and embed anywhere.">
<meta property="og:title" content="Maille">
<meta property="og:description" content="Animated ASCII scenes you can tune and embed anywhere.">
<meta property="og:image" content="https://maille-pi.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Space+Mono&family=Fira+Code:wght@400;600&family=DM+Mono&family=Courier+Prime&display=swap">
<style>
  /* Layout: studio — live stage with a transport bar on the left, a scrolling inspector of collapsible sections on the right; stacks on phones. Single dark look. */
  :root {
    --bg: #08090a;
    --surface: #0e0f11;
    --raised: #141518;
    --line: #1f2125;
    --fg: #e7e8ea;
    --muted: #80858d;
    --accent: #5ec8e0;
    --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font: 12px/1.4 var(--ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; box-sizing: border-box; margin: 0;
  }
  *, *::before, *::after { box-sizing: border-box; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 312px; gap: 20px; height: 100%; max-width: 1680px; margin: 0 auto; }

  /* Stage */
  .stage { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; }
  .well { min-height: 0; display: flex; align-items: center; justify-content: center; }
  .frame { position: relative; aspect-ratio: var(--ar); width: min(100%, calc((100dvh - 92px) * var(--arn))); max-width: 100%; background: #050506; }
  .frame.drop::after { content: ""; position: absolute; inset: 0; outline: 1px solid var(--accent); outline-offset: -1px; }
  canvas { display: block; width: 100%; height: 100%; }
  .transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .transport .scrub { flex: 1 1 160px; min-width: 120px; }
  .time { font: 12px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); min-width: 52px; }

  /* Inspector */
  .inspector { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 4px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .name { font-weight: 500; font-size: 14px; }
  .headlinks { display: flex; align-items: center; gap: 12px; }
  .headlinks a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
  .headlinks a:hover { border-color: var(--fg); }
  textarea[readonly] { color: var(--muted); }
  .presets { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; }
  details { border-top: 1px solid var(--line); }
  summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; color: var(--fg); font-weight: 500;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; width: 6px; height: 6px; border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; margin-right: 3px; }
  details[open] > summary::after { transform: rotate(45deg); }
  summary:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
  .body { display: grid; gap: 12px; padding-bottom: 14px; }
  .sub { color: var(--muted); padding-top: 4px; }

  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 10px; row-gap: 6px; min-height: 22px; }
  .row > label, .row > .lbl { color: var(--muted); }
  .row output { font: 11px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); text-align: right; }
  .row input[type=range] { grid-column: 1 / -1; }
  .row.stack > :last-child { grid-column: 1 / -1; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -4px; background: var(--fg); border: 0; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: var(--fg); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

  button, .file, select {
    font: 12px var(--ui); color: var(--muted); background: transparent;
    border: 1px solid var(--line); padding: 6px 9px; cursor: pointer; border-radius: 0; text-align: center;
  }
  button:hover, .file:hover, select:hover { color: var(--fg); }
  button:focus-visible, select:focus-visible, .file:focus-within { outline: 1px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed=true] { color: var(--fg); background: var(--line); }
  button.primary { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  select { color: var(--fg); background: var(--surface); text-align: left; }
  .file { position: relative; display: block; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  a.file { color: var(--muted); text-decoration: none; }
  a.file:hover { color: var(--fg); }
  input[type=text], textarea {
    font: 12px var(--mono); color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); padding: 6px 8px; width: 100%; border-radius: 0;
  }
  textarea { min-height: 96px; resize: vertical; }
  input[type=text]:focus, textarea:focus { outline: 1px solid var(--accent); outline-offset: -1px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); }
  .seg button { border: 0; border-left: 1px solid var(--line); padding-inline: 4px; }
  .seg button:first-child { border-left: 0; }
  .seg.grid3 { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
  .seg.grid3 button { border-left: 1px solid var(--line); border-top: 1px solid var(--line); margin: -1px 0 0 -1px; }

  .switch { width: 28px; height: 16px; padding: 0; position: relative; border: 1px solid var(--line); background: var(--surface); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: var(--muted); transition: transform .12s, background .12s; }
  .switch[aria-checked=true] { background: var(--line); }
  .switch[aria-checked=true]::after { transform: translateX(12px); background: var(--fg); }

  .swatch { display: inline-flex; align-items: center; gap: 8px; }
  .swatch input[type=color] { width: 22px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; cursor: pointer; }
  .swatch input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  .swatch input[type=color]::-webkit-color-swatch { border: 0; }
  .swatch input[type=color]::-moz-color-swatch { border: 0; }
  .swatch code { font: 11px var(--mono); color: var(--muted); width: 56px; }
  .colors { display: grid; gap: 6px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pair.three { grid-template-columns: 1fr 1fr 1fr; }
  .note { color: var(--muted); font-size: 11px; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 12px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .toast.on { opacity: 1; }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .frame { width: min(100%, calc(62dvh * var(--arn))); }
    .inspector { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { summary::after, .switch::after, .toast { transition: none; } }
</style>
</head>
<body>

<div class="app">
  <section class="stage">
    <div class="well"><div class="frame" id="frame"><canvas id="cv" aria-label="Animated ASCII scene"></canvas></div></div>
    <div class="transport">
      <button id="play" aria-pressed="false">Pause</button>
      <span class="time" id="time">0.0 s</span>
      <input class="scrub" type="range" id="scrub" min="0" max="120" step="0.05" value="0" aria-label="Time">
      <div class="seg" id="format" aria-label="Format">
        <button data-v="16:9">16:9</button><button data-v="3:4">3:4</button><button data-v="1:1">1:1</button><button data-v="9:16">9:16</button>
      </div>
      <button id="shuffle">Shuffle</button>
    </div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="head"><span class="name">Maille</span><span class="headlinks"><span class="note" id="seedNote"></span><a href="docs.html">Docs</a></span></div>

    <div class="seg grid3" id="sceneSeg" aria-label="Scene"></div>

    <div class="presets">
      <select id="presetSel" aria-label="Presets"></select>
      <button id="presetSave">Save</button>
      <button id="presetDel" title="Delete the selected saved preset">Delete</button>
    </div>

    <details open id="secScene"><summary id="secSceneTitle">Scene</summary><div class="body" id="sceneBody"></div></details>
    <details id="secColors"><summary>Colours</summary><div class="body" id="colorBody"></div></details>
    <details><summary>Characters</summary><div class="body" id="charBody"></div></details>
    <details><summary>Look</summary><div class="body" id="lookBody"></div></details>
    <details open id="secEmbed"><summary>Embed</summary>
      <div class="body">
        <div class="seg" id="embedKind"><button data-v="script" aria-pressed="true">Script</button><button data-v="iframe" aria-pressed="false">Iframe</button></div>
        <textarea id="embedBox" readonly spellcheck="false" aria-label="Embed code"></textarea>
        <div class="pair"><button class="primary" id="copyEmbed">Copy embed</button><a class="file" id="openEmbed" href="e.html" target="_blank" rel="noopener">Open preview</a></div>
        <p class="note" id="embedNote">Paste it into Framer, Webflow, Notion or any HTML page. The scene keeps every setting you see here.</p>
      </div>
    </details>
    <details><summary>Export</summary>
      <div class="body">
        <div class="row"><label for="pngSize">PNG width</label>
          <select id="pngSize"><option value="1920">1920</option><option value="2560" selected>2560</option><option value="3840">3840</option></select></div>
        <div class="row"><label for="recLen">Video length</label>
          <select id="recLen"><option value="5">5 s</option><option value="8" selected>8 s</option><option value="12">12 s</option><option value="20">20 s</option></select></div>
        <div class="pair"><button id="png">Save PNG</button><button id="rec">Record WebM</button></div>
        <span class="sub">Settings</span>
        <div class="pair three"><button id="copyJson">Copy</button><button id="saveJson">Save .json</button><label class="file" for="loadJson">Open<input type="file" id="loadJson" accept="application/json,.json"></label></div>
        <textarea id="jsonBox" placeholder="Paste settings JSON here, then Apply" spellcheck="false" aria-label="Settings JSON"></textarea>
        <div class="pair"><button id="applyJson">Apply</button><button id="resetAll">Reset all</button></div>
        <p class="note">window.maille.seek(t) renders an exact frame for scripted captures.</p>
      </div>
    </details>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="maille.js?v=2f14a68b"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const AF = window.Maille;
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const FORMATS = { '16:9': [16, 9], '3:4': [3, 4], '1:1': [1, 1], '9:16': [9, 16] };
  const SCENES = [['alpenglow', 'Alpenglow'], ['sharks', 'Sharks'], ['mantas', 'Mantas'], ['koi', 'Koi'], ['birds', 'Birds'], ['waves', 'Waves'], ['landscape', 'Landscape'], ['image', 'Image'], ['text', 'Text']];
  const SPECIES = { mix: ['grey', 'sand', 'hammer', 'grey'], grey: ['grey'], sand: ['sand'], hammer: ['hammer'] };
  const FONTS = [
    ['JetBrains Mono', '"JetBrains Mono", ui-monospace, monospace'], ['IBM Plex Mono', '"IBM Plex Mono", ui-monospace, monospace'],
    ['Space Mono', '"Space Mono", ui-monospace, monospace'], ['Fira Code', '"Fira Code", ui-monospace, monospace'],
    ['DM Mono', '"DM Mono", ui-monospace, monospace'], ['Courier Prime', '"Courier Prime", "Courier New", monospace'],
  ];
  const RAMPS = [['Classic', '@8%SX#t;:'], ['Dense', '@%#*+=-:.'], ['Letters', 'MWNXK0Okxdol:,.'], ['Blocks', '█▓▒░'], ['Binary', '10'], ['Dots', '●•·'], ['Hex', 'FEDCBA9876543210']];

  // ---------- formats ----------
  const f2 = (v) => (+v).toFixed(2), pct = (v) => Math.round(v * 100) + '%', int = (v) => String(Math.round(v)), xx = (v) => (+v).toFixed(1) + '×', deg = (v) => Math.round(v) + '°';

  // ---------- control schema ----------
  const SCENE_UI = {

      ['Light', [
        { k: 'agDaylight', label: 'Daylight', type: 'range', min: 0, max: 1, step: 0.01, fmt: pct },

        { k: 'agCycleSpeed', label: 'Cycle speed', type: 'range', min: 0.2, max: 4, step: 0.1, fmt: xx },

        { k: 'agRugged', label: 'Ruggedness', type: 'range', min: 0, max: 2, step: 0.05, fmt: xx },
        { k: 'agSnow', label: 'Snow cover', type: 'range', min: 0, max: 1, step: 0.01, fmt: pct },
        { k: 'agHaze', label: 'Haze', type: 'range', min: 0.4, max: 2.5, step: 0.05, fmt: xx },
        { k: 'agFar', label: 'Far ranges', type: 'toggle' },

      ['Atmosphere', [
        { k: 'agClouds', label: 'Clouds', type: 'range', min: 0, max: 1.5, step: 0.05, fmt: xx },

    ],

  function applyJson() {
    try { const d = JSON.parse($('jsonBox').value); delete d.app; delete d.v; applyState(d); fillPresets(); toast('Settings applied'); }
    catch { toast('That JSON could not be read'); }
  }
  $('applyJson').addEventListener('click', applyJson);
  $('resetAll').addEventListener('click', () => { applyState(defaults()); fillPresets('b0'); toast('Reset to defaults'); });

  // ---------- embed ----------
  const SITE = /^https?:/.test(location.protocol) ? location.origin : '__SITE_ORIGIN__';
  let embedKind = 'script';
  function embedCode() {
    const cfg = AF.compact(S), [w, h] = FORMATS[S.format];
    delete cfg.format;
    const json = JSON.stringify(cfg);
    const b = AF.b64.encode(json);
    if (embedKind === 'iframe') return `<iframe src="${SITE}/e.html?c=${b}" style="display:block;width:100%;aspect-ratio:${w}/${h};border:0" loading="lazy" title="Maille scene"></iframe>`;
    return `<script src="${SITE}/maille.js" defer><\/script>\n<maille-scene config='${json.replace(/'/g, '&#39;')}' style="display:block;width:100%;aspect-ratio:${w}/${h}"></maille-scene>`;
  }
  let embedT = 0;
  function refreshEmbed() {
    clearTimeout(embedT);
    embedT = setTimeout(() => {
      $('embedBox').value = embedCode();
      $('openEmbed').href = 'e.html?c=' + AF.b64.encode(JSON.stringify(Object.assign(AF.compact(S), { format: S.format })));
      $('embedNote').textContent = S.scene === 'image' && !S.src
        ? 'Image scenes use a file from your computer, which an embed cannot carry. Use Text or another scene for embeds.'
        : 'Paste it into Framer, Webflow, Notion or any HTML page. The scene keeps every setting you see here.';
    }, 120);
  }
  $('embedKind').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    embedKind = b.dataset.v;
    for (const x of $('embedKind').children) x.setAttribute('aria-pressed', String(x === b));
    refreshEmbed();
  });
  $('copyEmbed').addEventListener('click', () => {
    const code = embedCode();
    navigator.clipboard.writeText(code).then(() => toast('Embed copied'), () => { $('embedBox').select(); toast('Select and copy the code above'); });
  });

  window.maille = window.ascii = { engine, get state() { return S; }, seek(t) { setPlay(false); simT = t; engine.render(ctx, t); } };

  applyFormat(); buildStaticUI(); fillPresets(); fit(); loadFont(S.font); refreshEmbed(); syncSrc();
  if (document.fonts) document.fonts.ready.then(() => engine.refresh());
  requestAnimationFrame(tick);
})();
</script>

</body>
