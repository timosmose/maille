<style>
  /* Design system of timdalverny.com (dark theme): warm neutral greys, Inter, three text sizes, pills and soft rings.
     The scene fills the screen. Scenes run along the bottom bar; settings open in a drawer beside the scene. */
  :root {
    --gray-1: #12110f; --gray-2: #1d1c1a; --gray-3: #252321; --gray-4: #2d2b28; --gray-5: #34322f; --gray-6: #3d3a37;
    --gray-7: #4b4844; --gray-8: #615e59; --gray-9: #706d68; --gray-10: #918e88; --gray-11: #b6b3ad; --gray-12: #eeece8;
    --color-bg: var(--gray-1); --color-surface: var(--gray-2); --color-control: var(--gray-2); --color-control-thumb: var(--gray-5);
    --color-text-primary: var(--gray-12); --color-text-secondary: var(--gray-11); --color-text-tertiary: var(--gray-10);
    --color-border: var(--gray-4); --color-border-strong: var(--gray-6); --color-focus: var(--gray-12);
    --shadow-ring: 0 0 0 1px rgb(255 255 255 / 0.08);
    --shadow-sm: 0 0 0 1px rgb(255 255 255 / 0.08), 0 1px 2px -1px rgb(0 0 0 / 0.4);
    --shadow-md: 0 0 0 1px rgb(255 255 255 / 0.08), 0 8px 24px -6px rgb(0 0 0 / 0.6);
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --font-meta: 400 14px / 22px var(--font-sans); --font-meta-strong: 500 14px / 22px var(--font-sans); --font-label: 500 12px / 16px var(--font-sans);
    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-full: 999px;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --duration-fast: 150ms; --duration-base: 300ms;
    --pad: 24px; --head: 56px; --drawer: 320px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--color-bg); color: var(--color-text-secondary); font: var(--font-meta); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

  .app { position: relative; height: 100dvh; display: grid; grid-template-rows: var(--head) minmax(0, 1fr) auto; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--pad); border-bottom: 1px solid var(--color-border); }
  .brand { display: flex; align-items: center; gap: 10px; font: var(--font-meta-strong); color: var(--color-text-primary); }
  .brand svg { display: block; flex: none; }
  nav { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  nav a { padding: 5px 12px; border-radius: var(--radius-full); color: var(--color-text-tertiary); transition: color var(--duration-fast) ease, background-color var(--duration-fast) ease; }
  nav a:hover { color: var(--color-text-primary); background: var(--color-control); }
  nav a.cta { display: inline-flex; align-items: center; gap: 6px; height: 32px; margin-left: 8px; padding: 0 14px; color: var(--gray-1); background: var(--gray-12); font-weight: 500; }
  nav a.cta:hover { color: var(--gray-1); background: #fff; }
  nav a.cta svg { flex: none; }

  /* Stage */
  .well { position: relative; min-height: 0; container-type: size; display: grid; place-items: center; background: #0c0b0a; transition: margin-right var(--duration-base) var(--ease-out); }
  .frame { position: relative; aspect-ratio: var(--ar); width: min(100cqw, 100cqh * var(--arn)); }
  .frame.full { position: absolute; inset: 0; aspect-ratio: auto; width: auto; }
  .frame.drop::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--color-focus); pointer-events: none; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Bottom bar: scenes, then actions */
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 24px; padding: 12px var(--pad) max(12px, env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--color-border); }
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 104px; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; padding: 2px; margin: -2px; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 40px), transparent); }
  .strip::-webkit-scrollbar { display: none; }
  .tile { display: grid; gap: 6px; padding: 0; border: 0; background: none; color: var(--color-text-tertiary); font: var(--font-label); font-weight: 400; text-align: left; cursor: pointer; scroll-snap-align: start; transition: color var(--duration-fast) ease; }
  .tile maille-scene { width: 100%; aspect-ratio: 4 / 3; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-ring); pointer-events: none; transition: box-shadow var(--duration-fast) ease; }
  .tile:hover, .tile[aria-pressed=true] { color: var(--color-text-primary); }
  .tile[aria-pressed=true] maille-scene { box-shadow: 0 0 0 1px var(--color-text-primary); }
  .tile:focus-visible { outline-offset: 3px; border-radius: var(--radius-md); }
  .tile span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: grid; grid-auto-flow: column; gap: 8px; }

  /* Drawer */
  .drawer { position: absolute; top: var(--head); right: 0; bottom: var(--bar, 0px); width: var(--drawer); display: grid; grid-template-rows: minmax(0, 1fr) auto;
    background: var(--color-bg); border-left: 1px solid var(--color-border);
    transform: translateX(100%); visibility: hidden; transition: transform var(--duration-base) var(--ease-out), visibility 0s var(--duration-base); z-index: 5; }
  .drawer.open { transform: none; visibility: visible; transition: transform var(--duration-base) var(--ease-out); }
  .scroll { overflow-y: auto; overscroll-behavior: contain; }
  .sec { padding: 20px 24px 24px; display: grid; gap: 16px; }
  .sec + .sec { border-top: 1px solid var(--color-border); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border); font: var(--font-label); text-transform: uppercase; color: var(--color-text-secondary); }
  .sec-h > span:last-child { display: flex; gap: 16px; }
  .stack { display: grid; gap: 16px; }
  .link { padding: 0; border: 0; background: none; font: var(--font-label); text-transform: none; font-weight: 400; color: var(--color-text-tertiary); cursor: pointer; transition: color var(--duration-fast) ease; }
  .link:hover { color: var(--color-text-primary); }
  details > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--color-text-tertiary); cursor: pointer; transition: color var(--duration-fast) ease; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform var(--duration-base) var(--ease-out); }
  details[open] > summary::after { transform: translateY(2px) rotate(-135deg); }
  details > summary:hover { color: var(--color-text-primary); }
  details[open] > .stack { margin-top: 16px; }
  .foot { padding: 16px 24px; border-top: 1px solid var(--color-border); }

  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; row-gap: 8px; }
  .row > .lbl { color: var(--color-text-secondary); }
  .row output { color: var(--color-text-primary); font-variant-numeric: tabular-nums; text-align: right; }
  .row > input[type=range], .row > .seg, .row > textarea, .row > .chips, .row > input[type=text] { grid-column: 1 / -1; }
  .bgpick { display: flex; align-items: center; gap: 12px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--color-border-strong); }
  input[type=range]::-moz-range-track { height: 2px; background: var(--color-border-strong); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -6px; background: var(--gray-12); border: 0; border-radius: var(--radius-full); box-shadow: 0 1px 3px rgb(0 0 0 / 0.5); }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: var(--gray-12); border: 0; border-radius: var(--radius-full); box-shadow: 0 1px 3px rgb(0 0 0 / 0.5); }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 32px; height: 20px; padding: 0; border: 0; border-radius: var(--radius-full); overflow: hidden; background: none; box-shadow: var(--shadow-ring); cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; }
  input[type=color]::-moz-color-swatch { border: 0; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; font: var(--font-meta-strong); white-space: nowrap; color: var(--color-text-primary); background: var(--color-control); border: 0; border-radius: var(--radius-full); box-shadow: var(--shadow-ring); cursor: pointer; position: relative; transition: background-color var(--duration-fast) ease; }
  .btn:hover { background: var(--gray-3); }
  .btn.primary { background: var(--gray-12); color: var(--gray-1); box-shadow: none; }
  .btn.primary:hover { background: #fff; }
  .btn[aria-expanded=true] { background: var(--color-control-thumb); }
  .btn:disabled { color: var(--color-text-tertiary); cursor: default; }
  .btn:focus-within:has(input:focus-visible) { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  .btn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* Segmented controls: the site's pill switch */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 3px; background: var(--color-control); border-radius: var(--radius-full); box-shadow: var(--shadow-ring); }
  .seg button { height: 28px; border: 0; border-radius: var(--radius-full); background: none; color: var(--color-text-tertiary); cursor: pointer; padding: 0 4px; transition: color var(--duration-fast) ease, background-color var(--duration-fast) ease; }
  .seg button:hover { color: var(--color-text-primary); }
  .seg button[aria-pressed=true] { color: var(--color-text-primary); background: var(--color-control-thumb); box-shadow: var(--shadow-sm); }
  .seg.grid3 { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); border-radius: var(--radius-lg); }
  .seg.grid3 button { border-radius: var(--radius-md); height: 32px; }
  .seg.glyphs button { font: 400 14px var(--mono); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { height: 28px; padding: 0 10px; border: 0; border-radius: var(--radius-full); background: var(--color-control); box-shadow: var(--shadow-ring); color: var(--color-text-tertiary); font: var(--font-label); font-weight: 400; cursor: pointer; transition: color var(--duration-fast) ease, background-color var(--duration-fast) ease; }
  .chips button:hover { color: var(--color-text-primary); }
  .chips button[aria-pressed=true] { color: var(--color-text-primary); background: var(--color-control-thumb); box-shadow: var(--shadow-sm); }

  .switch { width: 36px; height: 20px; padding: 0; position: relative; border: 0; border-radius: var(--radius-full); background: var(--gray-4); cursor: pointer; transition: background-color var(--duration-base) var(--ease-out); }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--radius-full); background: var(--gray-10); box-shadow: 0 1px 2px rgb(0 0 0 / 0.4); transition: transform var(--duration-base) var(--ease-out), background-color var(--duration-base) var(--ease-out); }
  .switch[aria-checked=true] { background: var(--gray-12); }
  .switch[aria-checked=true]::after { transform: translateX(16px); background: var(--gray-1); }

  textarea, input[type=text] { color: var(--color-text-primary); background: var(--color-control); border: 0; border-radius: var(--radius-md); box-shadow: var(--shadow-ring); padding: 8px 12px; width: 100%; }
  textarea { min-height: 72px; resize: vertical; font: 500 14px / 22px var(--font-sans); }
  input[type=text] { font: 400 14px var(--mono); }
  textarea:focus-visible, input[type=text]:focus-visible { outline: 0; box-shadow: 0 0 0 1px var(--color-text-primary); }
  ::placeholder { color: var(--gray-8); }

  .toast { position: fixed; left: 50%; top: calc(var(--head) + 16px); transform: translateX(-50%); background: var(--gray-12); color: var(--gray-1); padding: 6px 14px; border-radius: var(--radius-full); font: var(--font-meta-strong); box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: opacity var(--duration-fast) ease; z-index: 10; }
  .toast.on { opacity: 1; }

  .drawer .close { display: none; }
  @media (min-width: 861px) { .app.editing .well { margin-right: var(--drawer); } }
  @media (max-width: 860px) {
    :root { --pad: 16px; --head: 52px; }
    nav a { padding: 5px 8px; }
    nav .docs { display: none; }
    nav a.cta { margin-left: 4px; padding: 0 12px; }
    .bar { grid-template-columns: 1fr; gap: 12px; }
    .strip { margin-inline: calc(-1 * var(--pad)); padding-inline: var(--pad); scroll-padding-inline: var(--pad); grid-auto-columns: 92px; }
    .actions { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
    .actions .btn { padding: 0 6px; }
    .actions .primary { grid-column: 1 / -1; grid-row: 1; }
    .drawer { top: auto; left: 0; width: auto; bottom: 0; max-height: 72dvh; border-left: 0; border-top: 1px solid var(--color-border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-md); transform: translateY(100%); }
    .drawer.open { transform: none; }
    .drawer .close { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer, .drawer.open, .well, .switch, .switch::after, .toast { transition: none; } }
</style>

(() => {
  const $ = (id) => document.getElementById(id);
  const AF = window.Maille;

    rec.onerror = () => { stream.getTracks().forEach((t) => t.stop()); btn.disabled = false; btn.textContent = 'Record video'; toast('Recording failed'); };
    rec.onstop = () => { stream.getTracks().forEach((t) => t.stop()); btn.disabled = false; btn.textContent = 'Record video'; download(fileName(type.includes('mp4') ? 'mp4' : 'webm'), new Blob(chunks, { type: type.split(';')[0] })); toast('Video saved'); };
    playing = true; btn.disabled = true; rec.start();
    let left = secs; btn.textContent = `Recording ${left} s`;
    const iv = setInterval(() => { left--; if (left > 0) btn.textContent = `Recording ${left} s`; else { clearInterval(iv); rec.stop(); } }, 1000);
  });
  const SITE = /^https?:/.test(location.protocol) ? location.origin : 'https://maille-pi.vercel.app';
  function embedCode() {
    const cfg = AF.compact(S), f = FORMATS[S.format];
    delete cfg.format;
    const json = JSON.stringify(cfg).replace(/&/g, '&amp;').replace(/'/g, '&#39;');
    const style = f ? `display:block;width:100%;aspect-ratio:${f[0]}/${f[1]}` : 'display:block;width:100%;height:100%;min-height:320px';
    return `<script src="${SITE}/maille.js" defer><\/script>\n<maille-scene config='${json}' style="${style}"></maille-scene>`;
  }
  $('copyEmbed').addEventListener('click', () => {
    const code = embedCode(), long = code.length > 45000;
    navigator.clipboard.writeText(code).then(() => toast(long ? 'Copied. With the photo inside it is long: some site builders cap embeds near 50,000 characters' : 'Embed code copied'), () => toast('Copy was blocked by the browser'));
  });

  window.maille = { engine, get state() { return S; }, seek(t) { playing = false; simT = t; engine.render(ctx, t); } };

  applyFormat(); buildUI(); buildStrip(); fit(); syncSrc();
  // settings open from the start on wide screens; on phones they wait for Edit
  if (matchMedia('(min-width: 861px)').matches) openDrawer(true);
  if (document.fonts) document.fonts.ready.then(() => { engine.refresh(); dirty = true; });
  requestAnimationFrame(tick);
})();
</script>
