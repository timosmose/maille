<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maille film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; display: grid; place-items: center; }
  canvas { max-width: 100vw; max-height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<script src="maille.js"></script>
<script>
/*
 * A film is a list of shots on one timeline. Edit SHOTS and TITLES, nothing else is required.
 *
 * Shot:  { from, to, preset?, config?, offset? }
 *   from, to   seconds on the film timeline. Two shots that overlap crossfade over the overlap.
 *   preset     a built-in Maille preset name (sharks, koi, mantas, gulls, alpenglow, night-ocean, moo, meadow, type...)
 *   config     any Maille setting, merged on top of the preset (see reference/config.md)
 *   offset     seconds added to the shot's own clock, to start it mid-motion
 *
 * Title: { text, from, to, x, y, size, align }
 *   x, y as fractions of the frame, size in px at the film's resolution. Letters resolve out of
 *   random glyphs when the title appears, and dissolve back when it leaves.
 *
 * URL: ?w=1920&h=1080 to change the size, ?t=12.5 to jump to a time. Space pauses.
 */
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1080, H = +q.get('h') || 1920;
const BG = '#050506';
const FONT = '"JetBrains Mono", ui-monospace, monospace';

const SHOTS = [
  { from: 0, to: 6, preset: 'koi', config: { count: 6, cols: 64, seed: 11 } },
  // A photo: put the file next to this page and use src: 'photo.jpg', with anim from reference/photo-motion.md
  { from: 5, to: 11, preset: 'meadow', config: { cols: 120, src: 'https://maille-pi.vercel.app/img/meadow.jpg' } },
  { from: 10, to: 15, preset: 'type', config: { text: 'MAILLE', cols: 70, seed: 3 } },
];
const TITLES = [
  { text: 'Slow water', from: 1.2, to: 4.8, x: 0.5, y: 0.86, size: 44, align: 'center' },
];

// ---------------------------------------------------------------- engine
const cv = document.getElementById('film'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const DURATION = Math.max(...SHOTS.map((s) => s.to), ...TITLES.map((s) => s.to));

const layers = SHOTS.map((s) => {
  const base = s.preset && Maille.PRESETS[s.preset] ? Maille.PRESETS[s.preset].config : {};
  const cfg = Maille.resolve(Object.assign({}, base, s.config || {}));
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  return { s, cfg, off, octx: off.getContext('2d'), engine: null };
});

async function setup() {
  await Promise.all(layers.map(async (L) => {
    const src = L.cfg.scene === 'image' && L.cfg.src ? await Maille.loadSrc(L.cfg.src).catch((e) => { console.warn(e.message); return null; }) : null;
    await Maille.ensureFont(L.cfg.font);
    L.engine = Maille.create(Object.assign({ width: W, height: H }, Maille.toEngine(L.cfg, src)));
    L.engine.refresh();
  }));
  await document.fonts.load(`700 40px ${FONT}`).catch(() => {});
}

// Share of a shot visible at time t: 0..1, ramps over the overlap with its neighbours
function visibility(i, t) {
  const s = SHOTS[i];
  if (t < s.from || t > s.to) return 0;
  let v = 1;
  const prev = SHOTS[i - 1], next = SHOTS[i + 1];
  if (prev && prev.to > s.from) v = Math.min(v, (t - s.from) / (prev.to - s.from));
  if (next && next.from < s.to) v = Math.min(v, (s.to - t) / (s.to - next.from));
  return Math.max(0, Math.min(1, v));
}

const GLYPHS = '@8%SX#t;:.';
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
function drawTitle(T, t) {
  const n = T.text.length, inT = 0.6, outT = 0.4;
  let s = '';
  for (let i = 0; i < n; i++) {
    const ch = T.text[i];
    if (ch === ' ') { s += ' '; continue; }
    const appear = T.from + (i / n) * inT, leave = T.to - outT + hash(i, 7) * outT;
    if (t < appear - 0.25 || t > leave) { s += ' '; continue; }
    s += t < appear ? GLYPHS[Math.floor(hash(i, Math.floor(t * 24)) * GLYPHS.length)] : ch;
  }
  ctx.font = `700 ${T.size}px ${FONT}`;
  ctx.textAlign = T.align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e7e8ea';
  ctx.fillText(s, T.x * W, T.y * H);
}

function draw(t) {
  ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  layers.forEach((L, i) => {
    const v = visibility(i, t);
    if (v <= 0) return;
    L.engine.set({ presence: v });
    L.engine.render(L.octx, (t - L.s.from + (L.s.offset || 0)) * L.cfg.speed);
    ctx.globalAlpha = Math.min(1, v * 1.4);
    ctx.drawImage(L.off, 0, 0);
  });
  ctx.globalAlpha = 1;
  for (const T of TITLES) if (t >= T.from - 0.3 && t <= T.to) drawTitle(T, t);
}

// ---------------------------------------------------------------- playback and capture
let now = +q.get('t') || 0, playing = !q.has('capture'), last = 0;
window.DURATION = DURATION;
window.SIZE = [W, H];
window.seek = (t) => { now = t; draw(t); };
window.frame = () => cv.toDataURL('image/png');
window.ready = setup().then(() => { draw(now); return true; });
window.ready.then(() => {
  if (!playing) return;
  const loop = (ms) => {
    if (last && playing) { now += Math.min(0.05, (ms - last) / 1000); if (now > DURATION) now = 0; draw(now); }
    last = ms; requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); playing = !playing; } });
</script>
</body>
</html>
